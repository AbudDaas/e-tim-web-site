<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة · Sayfa bulunamadı</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:24px}
  .dort{max-width:520px;text-align:center}
  .dort .kod{font-family:var(--disp);font-weight:800;font-size:clamp(64px,18vw,120px);line-height:1;
    background:linear-gradient(100deg,var(--murekkep),var(--menekse),var(--turkuaz));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .dort p{color:var(--gece-2);margin:10px 0 22px;font-size:15.5px}
  .dort .satir{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
  <div class="card pad dort">
    <div class="kod">404</div>
    <h2>الصفحة غير موجودة</h2>
    <p>الرابط قد يكون قديمًا أو مكتوبًا بشكل خاطئ.<br>
       <span style="opacity:.7">Aradığın sayfa bulunamadı · Page not found</span></p>
    <div class="satir">
      <a class="btn" href="./">العودة إلى الرئيسية</a>
      <a class="btn ghost" href="./#/sinav">دخول الاختبار</a>
    </div>
  </div>
  <script>
    /* Tek sayfa uygulamada #/... adresleri 404'e düşerse ana sayfaya taşı. */
    (function(){
      var h=location.hash;
      if(h && h.indexOf("#/")===0) location.replace("./"+h);
    })();
  </script>
</body>
</html>
