<script>
/* Beklenmedik bir hata olursa boş ekran yerine uyarı göster. */
/* Teşhis: adrese #tani eklenirse ekrandan taşan öğeleri listeler. */
function tasmaTespit(){
  var g=document.documentElement.clientWidth, liste=[];
  document.querySelectorAll("*").forEach(function(e){
    var r=e.getBoundingClientRect();
    if(r.width>g+2 || r.right>g+2 || r.left<-2){
      liste.push((e.tagName.toLowerCase())+(e.id?"#"+e.id:"")+(e.className&&typeof e.className==="string"?"."+e.className.trim().split(/\s+/).join("."):"")
        +" → g:"+Math.round(r.width)+" sol:"+Math.round(r.left)+" sağ:"+Math.round(r.right));
    }
  });
  return {ekran:g, sayfa:document.documentElement.scrollWidth, tasanlar:liste.slice(0,12)};
}
window.addEventListener("hashchange",function(){ if(location.hash==="#tani") setTimeout(taniGoster,300); });
function taniGoster(){
  var s=tasmaTespit();
  var k=document.getElementById("hataKutusu");
  k.className="hata-kutu"; k.dataset.acik="1";
  k.innerHTML='<div class="hata-ic" style="max-width:520px;text-align:start"><b>Taşma teşhisi</b>'+
    '<p>Ekran: '+s.ekran+'px · Sayfa: '+s.sayfa+'px</p>'+
    '<code style="white-space:pre-wrap;text-align:start">'+(s.tasanlar.join("\n")||"taşan öğe yok")+'</code>'+
    '<button onclick="location.hash=\'#/\';document.getElementById(\'hataKutusu\').className=\'hidden\';document.getElementById(\'hataKutusu\').dataset.acik=\'\'">Kapat</button></div>';
}
window.addEventListener("error",function(e){
  var v=document.getElementById("view");
  if(v && !v.innerHTML.trim()){
    v.innerHTML='<div style="max-width:520px;margin:40px auto;padding:22px;border-radius:16px;'+
      'background:#fff;font-family:system-ui;line-height:1.6">'+
      '<b style="font-size:18px">Sayfa yüklenemedi</b>'+

      'style="padding:10px 18px;border:0;border-radius:999px;background:#4338CA;color:#fff;cursor:pointer">'+
      'Sıfırla ve yenile</button></div>';
  }
});
